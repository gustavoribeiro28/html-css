<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesclagem de células</title>
    <style>

        h1{
            text-align: center;
        }

        table{
            border-collapse: collapse;
            margin: auto;
        }

        td{
            width: 200px;
            height: 100px;
            text-align: center;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tr>
            <td rowspan="4">a1</td>
            <td colspan="2">a2</td>
            
        </tr>
        <tr>
            
            <td rowspan="2">b2</td>
            <td>b3</td>
        </tr>
        <tr>
            
            
            <td>c3</td>
        </tr>
        <tr>
            
            <td colspan="2">d2</td>
            
        </tr>
    </table>
</body>
</html>
