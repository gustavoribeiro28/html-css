<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <form action="#" method="post">
        <p>
        <label for="cor">sua cor preferida:</label>
        <input type="color" name="cor" id="cor" value=" #0000">
        </p>
        <p>
        <label for="nota">satisfação</label>
        <input type="range" name="nota" id="nota" min="0" max="100" step="10">
        </p>
        <p>
            <label for="arq">selecione um arquivo</label>
            <input type="file" name="arq" id="arq">
        </p>
        <input type="submit" value="selecione">
    </form>
</body>
</html>
