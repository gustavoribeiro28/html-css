<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando media</title>
    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        H1{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8rem;
            font-weight: 700;
            text-align: center;
            background-color: black;
            color: aliceblue;
        }

        @media ( max-width: 760px) {
            h1{
                font-weight: 700;
                font-size: 50px;
                padding-top: 10px;

                padding-left: 10px;

                color: black;
            }
        }
    </style>
</head>
<body>
    <h1>DREAMLIKE</h1>

</html>
