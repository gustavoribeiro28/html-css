<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando media</title>
    <style>

        H1{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8rem;
            font-weight: 700;
            text-align: center;
        }

        @media ( max-width: 760px) {
            h1{
                font-weight: 700;
                font-size: 5rem;
            }
        }

        @media ( max-widht: 500px){
            h1{
                font-size: 40px;
                padding-left: 10px;
                text-align: left;
            }
        }

    </style>
</head>
<body>
    <h1>DREAMLIKE</h1>
</body>
</html>
