<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulários</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Julius+Sans+One&display=swap');
    h1{
        font-family: "Julius Sans One", sans-serif;
        font-weight: 400;
        font-style: normal;
    }

    h2{
        font-family: "Julius Sans One", sans-serif;
        font-weight: 400;
        font-style: normal;
    }
    </style>

</head>
<body>
    <h1>teste de formulário</h1>
    <form action="" method="get">
        <h2>cadastro</h2>
        <p>
           <label for="inome">nome:</label>
           <input type="text" name="inome" id="inome" required maxlength="30" placeholder="nome completo">
        </p>

        <p>
           <label for="imedia">média:</label>
           <input type="number" name="media" id="imedia" value="5" min="0" max="10" step="0.5" required>
        </p>

        <p>
            <label for="imes">período letivo</label>
            <input type="month" name="imes" id="imes" required>
        </p>

        <p>
            <label for="idia">data:</label>
            <input type="date" name="idia" id="idia" required>
        </p>

        <p>
            <label for="itime">hora/prova</label>
            <input type="time" name="itime" id="itime">
        </p>

        <p>
        <input type="submit" value="enviar">
        </p>
    </form>
</body>
</html>
